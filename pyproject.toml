[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feed-python"
version = "0.1.0"
description = "Python client for project-scoped measurements and events"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["data-logging", "analytics", "machine-learning", "experiments", "feed"]
dependencies = [
    "requests>=2.25",
]

[project.scripts]
feed = "feed.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/feed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
